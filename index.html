<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Deep Links</title>
    <script>
        class SocialDeepLink {
            constructor() {
                this.socialLinks = {
                    instagram: {
                        app: "instagram://user?username=fushshorebro",
                        web: "https://www.instagram.com/fushshorebro/",
                    },
                    facebook: {
                        app: "fb://profile/100064816895509",
                        web: "https://www.facebook.com/@fushshorebro/", // Removed %40 since it’s not needed here
                    },
                };
            }

            isAndroid() {
                return /android/i.test(navigator.userAgent);
            }

            isIOS() {
                return /iPhone|iPad|iPod/i.test(navigator.userAgent);
            }

            isInAppBrowser() {
                return /FBAN|FBAV|Instagram/.test(navigator.userAgent);
            }

            openSocialApp(platform) {
                const link = this.socialLinks[platform];
                if (!link || !link.app) {
                    console.error("Platform not supported");
                    return;
                }

                const appUrl = link.app;
                const webUrl = link.web;

                // If in an in-app browser, open web URL in a new tab and skip app attempt
                if (this.isInAppBrowser()) {
                    console.log(`In-app browser detected, opening ${webUrl} in new tab`);
                    window.open(webUrl, "_blank");
                    return;
                }

                // Attempt to open the app
                console.log(`Attempting to open ${platform} app: ${appUrl}`);
                window.location.href = appUrl;

                // Use a combination of blur/focus to detect if the app opened
                let appOpened = false;
                const onBlur = () => {
                    appOpened = true; // Assume app opened when window loses focus
                    console.log(`${platform} app likely opened`);
                };
                const onFocus = () => {
                    if (!appOpened) {
                        console.log(`App didn't open, opening ${webUrl} in new tab`);
                        window.open(webUrl, "_blank");
                    }
                };

                window.addEventListener("blur", onBlur, { once: true });
                window.addEventListener("focus", onFocus, { once: true });

                // Fallback after 2 seconds if no blur/focus events occur
                setTimeout(() => {
                    if (!appOpened) {
                        console.log(`Timeout: No app detected, opening ${webUrl} in new tab`);
                        window.open(webUrl, "_blank");
                    }
                }, 2000); // Increased to 2000ms for more reliable app detection
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            const socialDeepLink = new SocialDeepLink();
            document.getElementById("openInstagram").addEventListener("click", () => {
                socialDeepLink.openSocialApp("instagram");
            });
            document.getElementById("openFacebook").addEventListener("click", () => {
                socialDeepLink.openSocialApp("facebook");
            });
        });
    </script>
</head>
<body>
    <h1>Open Social Media Apps</h1>
    <button id="openInstagram">Open Instagram</button>
    <button id="openFacebook">Open Facebook</button>
</body>
</html>
